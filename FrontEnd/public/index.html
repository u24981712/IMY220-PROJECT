<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- <link rel="icon" type="image/png" href="/assets/images/fav.png"/> -->
    <link rel="icon" type="image/x-icon" href="/assets/images/favicon.ico" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IMY 220 D1</title>
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=more_vert"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,0,0&icon_names=info"
    />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap");
      @import url("https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap");

      :root {
        --bg: #011a27;
        --bgLight: #0a2231;
        --secondary: #017b7e;
        --accent: #7be3d0;
        --light: #f5edd8;
      }

      body {
        margin: 0;
        overflow-x: hidden;
      }

      ::-webkit-scrollbar {
        width: 12px;
      }

      ::-webkit-scrollbar-track {
        background: var(--bgLight);
        border-radius: 10px;
      }

      ::-webkit-scrollbar-thumb {
        background-color: var(--light);
        border-radius: 10px;
        border: 3px solid transparent;
        background-clip: content-box;
      }

      ::-webkit-scrollbar-thumb:hover {
        background-color: var(--light);
        opacity: 0.8;
      }

      #id {
        position: relative;
        top: 0;
        /* left: 0; */
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="text/javascript" src="bundle.js"></script>
    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script>
      AOS.init();
    </script>
  </body>
</html>
